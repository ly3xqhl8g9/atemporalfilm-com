name: Build Atemporal Film
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "meta/**"
      - "scripts/**"

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: gitea.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Set Variables
        id: vars
        run: |
          set -eu
          shortSHA=$(git rev-parse --short HEAD)
          echo "shortsha=${shortSHA}" >> "$GITHUB_OUTPUT"
          echo "imagene=hypod.cloud/plurid/production/plurid-app-atemporalfilm-com:${shortSHA}" >> "$GITHUB_OUTPUT"
      - name: Login to Hypod
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
        with:
          registry: hypod.cloud
          username: ${{ secrets.HYPOD_IDENTONYM }}
          password: ${{ secrets.HYPOD_TOKEN }}
      - name: Build Imagene
        run: |
          docker build --platform linux/amd64 \
            --build-arg COMMIT_SHA=${{ steps.vars.outputs.shortsha }} \
            -t ${{ steps.vars.outputs.imagene }} .
      - name: Push Imagene
        run: docker push ${{ steps.vars.outputs.imagene }}
      - name: Setup kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8 # v3
        with:
          version: v1.31.0
      - name: Set kubectl Context
        uses: azure/k8s-set-context@0b53301dcc7ddd3f6d35f97fb67228ac4e5ab2fd # v2
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Verify cluster access
        run: |
          set -eu
          kubectl -n craft-atemporalfilm auth can-i patch deployment/atemporalfilm --quiet
          kubectl -n craft-atemporalfilm get deployment atemporalfilm
      - name: Deploy to Kubernetes
        run: |
          set -eu
          sed 's/:COMMIT_SHA/:${{ steps.vars.outputs.shortsha }}/g' \
            .gitea/deployment/atemporalfilm/Deployment.template.yaml \
            | kubectl -n craft-atemporalfilm apply -f -
      - name: Wait for the rollout
        timeout-minutes: 10
        run: |
          set -eu
          ns=craft-atemporalfilm
          dep=deployment/atemporalfilm
          want='${{ steps.vars.outputs.imagene }}'
          got="$(kubectl -n "$ns" get "$dep" -o jsonpath='{.spec.template.spec.containers[0].image}')"
          [ "$got" = "$want" ] || { echo "expected ${want}, found ${got}"; exit 1; }
          gen="$(kubectl -n "$ns" get "$dep" -o jsonpath='{.metadata.generation}')"
          replicas="$(kubectl -n "$ns" get "$dep" -o jsonpath='{.spec.replicas}')"
          for _ in $(seq 1 96); do
            obs="$(kubectl -n "$ns" get "$dep" -o jsonpath='{.status.observedGeneration}' 2>/dev/null || true)"
            upd="$(kubectl -n "$ns" get "$dep" -o jsonpath='{.status.updatedReplicas}' 2>/dev/null || true)"
            rdy="$(kubectl -n "$ns" get "$dep" -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)"
            total="$(kubectl -n "$ns" get "$dep" -o jsonpath='{.status.replicas}' 2>/dev/null || true)"
            # During a surge, the sole Ready replica may still be the old pod.
            # Wait for old replicas to disappear before counting readiness as success.
            if [ "${obs:-0}" -ge "$gen" ] && [ "${upd:-0}" -eq "$replicas" ] && [ "${rdy:-0}" -eq "$replicas" ] && [ "${total:-0}" -eq "$replicas" ]; then
              echo "rollout complete: ${want}, generation ${obs}, ${rdy}/${replicas} ready"
              exit 0
            fi
            echo "generation ${obs:-0}/${gen}, updated ${upd:-0}, ready ${rdy:-0}/${replicas}, total ${total:-0}"
            sleep 5
          done
          echo "rollout did not complete within 8 minutes"
          exit 1
      - name: Verify the live site
        run: |
          set -eu
          want='ok ${{ steps.vars.outputs.shortsha }}'
          for host in atemporalfilm.com www.atemporalfilm.com; do
            for _ in $(seq 1 12); do
              body="$(curl -fsS --max-time 15 "https://${host}/api/health" || true)"
              [ "$body" = "$want" ] && break
              sleep 5
            done
            [ "$body" = "$want" ] || { echo "${host} did not report ${want}"; exit 1; }
            curl -fsS --max-time 30 "https://${host}/" -o /dev/null
            curl -fsS --max-time 30 "https://${host}/about" -o /dev/null
            echo "${host}: ${body}; home and about return success"
          done
      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n craft-atemporalfilm get pods -o wide || true
          kubectl -n craft-atemporalfilm describe deployment atemporalfilm || true
          kubectl -n craft-atemporalfilm get events --sort-by=.lastTimestamp | tail -30 || true
          kubectl -n craft-atemporalfilm logs -l app=atemporalfilm --tail=100 --all-containers || true
      - name: Cleanup Imagene
        if: always()
        run: docker rmi '${{ steps.vars.outputs.imagene }}' || true
